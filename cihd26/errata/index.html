<script>
(() => {
  const KEY = "cihd_ok";
  const H_OK = "9e64cbeba413a81d44de8c238c46266713e6f9f7d2a382fecb929e2cab5ab5ae";

  async function sha256_hex(s) {
    const b = new TextEncoder().encode(s);
    const d = await crypto.subtle.digest("SHA-256", b);
    return [...new Uint8Array(d)]
      .map(x => x.toString(16).padStart(2, "0"))
      .join("");
  }

  async function gate() {
    if (sessionStorage.getItem(KEY) === "1") return;

    const st = document.createElement("style");
    st.textContent = "html{visibility:hidden}";
    document.head.appendChild(st);

    const pw = prompt("Enter password:");
    if (!pw) { location.href = "/"; return; }

    const h = await sha256_hex(pw);
    if (h !== H_OK) { alert("Nope."); location.href = "/"; return; }

    sessionStorage.setItem(KEY, "1");
    st.remove();
  }

  gate();
})();
</script>
